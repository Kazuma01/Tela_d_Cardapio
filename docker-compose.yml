version: "2.4 Beta"

services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - redis
        networks:
            - laravel

    
    # reverb (websocket) — acessível só pela rede Docker (via Caddy)
    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        command: php artisan reverb:start --host=0.0.0.0 --port=8081
        depends_on:
            - redis
        networks:
            - laravel

    # nginx — acessível só pela rede Docker (via Caddy)
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - laravel

    # caddy — única porta pública: 80 (redireciona) e 443 (HTTPS/WSS)
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        environment:
            # IP atual como SAN secundário do certificado. O nome mDNS
            # (cardapio.local) é o endereço principal e não muda com a rede.
            CARDAPIO_IP: ${CARDAPIO_IP:-192.168.100.114}
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - nginx
            - reverb
        networks:
            - laravel

    # scheduler — roda tarefas agendadas (ex.: limpeza da auditoria)
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        command: php artisan schedule:work
        depends_on:
            - db
            - redis
        networks:
            - laravel

    # db mysql
    db:
        image: mysql:8.4
        platform: linux/x86_64
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-userpass}
            MYSQL_USER: ${DB_USERNAME:-username}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            # Só acessível da própria máquina (antes ficava exposto na LAN)
            - "127.0.0.1:3300:3306"
        networks:
            - laravel

    # PHPMyAdmin
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        ports:
            # Só acessível da própria máquina (antes ficava exposto na LAN)
            - "127.0.0.1:8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
        networks:
            - laravel

    # redis
    redis:
        image: redis:latest
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    # Persistem a CA interna e os certificados emitidos pelo Caddy.
    # A chave privada da CA fica em caddy_data e NUNCA deve sair daqui.
    caddy_data:
    caddy_config:
